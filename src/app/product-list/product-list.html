<div class="container my-4">
  <h2>Featured Products</h2>
  <table class="table table-striped table-bordered text-center align-middle">
    <thead class="table-dark">
      <tr>
        <th>ID</th><th>Nom</th><th>Prix</th>
        <th>Quantité</th><th>Likes</th><th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (p of products; track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.name }}</td>
          <td>{{ p.price }} $</td>
          <td>{{ p.quantity }}</td>
          <td>{{ p.likes }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" (click)="like(p)">Like</button>
            <button class="btn btn-sm btn-success" (click)="buy(p)"
                    [disabled]="p.quantity === 0">Buy</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
